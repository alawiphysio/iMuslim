name: Fetch images
on:
  push:
    branches: [ img-fetch ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          while read k u; do
            curl -sSf -o out/$k.png "$u" && echo "$k $(file -b out/$k.png | head -c 60)"
          done < urls.txt
          git config user.name alawiphysio; git config user.email alawiphysio@users.noreply.github.com
          git add out && git commit -m "images [skip ci]" && git push
